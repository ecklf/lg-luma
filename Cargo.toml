[package]
name = "luma"
version = "3.8.2"
edition = "2024"
rust-version = "1.88"
publish = false
default-run = "luma"
license = "MIT"
description = "A remote-first native launcher for rooted LG webOS TVs"

[workspace]
members = ["vector-geometry", "tools/vector-assets", "tv-helper"]
resolver = "3"

[features]
default = []
webos = ["dep:libc", "luma-tv-helper/webos"]

[dependencies]
luma-tv-helper = { path = "tv-helper" }
getrandom = "0.2"
gl = "0.14"
if-addrs = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = { version = "0.2", optional = true }
luma-vector-geometry = { path = "vector-geometry" }
# We read character maps, metrics, legacy kerning and outlines, not shaping tables
# or glyph names. Keep variable-font support for the bundled Noto fonts.
owned_ttf_parser = { version = "0.25", default-features = false, features = [
  "std",
  "variable-fonts",
] }
qrcodegen = "1.8"
ring = "0.17"
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset", "formatting", "parsing"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[profile.release]
# Whole-program optimization reduces shipped code without using size-first
# optimization on the renderer, image processing or glyph tessellation.
lto = "fat"
strip = true
codegen-units = 1

# Keep on-demand glyph geometry responsive in desktop debug previews.
[profile.dev.package.lyon_tessellation]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3
