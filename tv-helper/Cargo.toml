[package]
name = "luma-tv-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[[bin]]
name = "luma-helper"
path = "src/main.rs"

[features]
default = []
webos = ["dep:libc"]

[dependencies]
libc = { version = "0.2", optional = true }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
